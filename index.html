<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123D33" />
    <meta name="description" content="An independent student-built companion for HSWT's Weihenstephan and Triesdorf campuses." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CampusLeaf" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('campusleaf.hswt.v1') || '{}');
        document.documentElement.dataset.firstTheme = saved.theme === 'light' ? 'light' : 'dark';
      } catch (_) { document.documentElement.dataset.firstTheme = 'dark'; }
    </script>
    <style>html[data-first-theme="dark"]{background:#101F1A}html[data-first-theme="dark"] body{background:#101F1A;color:#E9F4E9}</style>
    <title>CampusLeaf — Your HSWT student companion</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="./data-services.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
