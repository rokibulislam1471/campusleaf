name: Deploy CampusLeaf to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "12 5 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public-menu parser dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Run JavaScript tests
        run: node --test tests/*.cjs
      - name: Run source parser tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh public canteen menus
        run: python scripts/update_menus.py
      - name: Check menu snapshot syntax
        run: python -m json.tool data/menu-snapshot.json > /dev/null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
